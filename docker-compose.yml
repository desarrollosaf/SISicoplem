services:
  frontend:
    image: node:24-alpine
    container_name: sisicoplem-frontend
    working_dir: /app

    ports:
      - "4220:4200"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - /app/backend

    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_HOST: backend
      BACKEND_PORT: "3060"

    command: >
      sh -c "npm install &&
      npm run start --
      --host 0.0.0.0
      --port 4200
      --poll=1000"

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: sisicoplem-backend
    working_dir: /app

    ports:
      - "3065:3060"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 3060
      TZ: America/Mexico_City
      CHOKIDAR_USEPOLLING: "true"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: >
      sh -c "npm install &&
      npm run start:dev"

    restart: unless-stopped

  # MariaDB local para desarrollo. Para usar la base de datos actual: pon su volcado .sql en
  # ./backend/database-dump y se importa solo la primera vez que arranca el contenedor.
  # Solo arranca con `docker compose --profile db up` y DB_HOST=db en backend/.env.
  # Por defecto el backend usa el MySQL de esta máquina (DB_HOST=host.docker.internal).
  db:
    profiles: ["db"]
    image: mariadb:11
    container_name: sisicoplem-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-sicoplem}
      TZ: America/Mexico_City
    ports:
      - "3316:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database-dump:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
  db_data:
